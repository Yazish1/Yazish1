name: Update currently reading cover

on:
  schedule:
    - cron: "0 * * * *" # runs hourly
  workflow_dispatch: # lets you trigger it manually from the Actions tab

jobs:
  update-cover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate cover card
        env:
          GOODREADS_USER_ID: "203298364" # your Goodreads user ID
          GOODREADS_SHELF: "currently-reading"
        run: node scripts/generate-reading-card.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/currently-reading.svg
          git diff --staged --quiet || git commit -m "Update currently reading cover"
          git push
